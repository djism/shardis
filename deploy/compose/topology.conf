# Docker Compose cluster topology. Same file on every node.
# Clients (redis-cli on the host) are told 127.0.0.1:700X, which Compose
# publishes; nodes reach each other by container name on the Docker network
# (ADR 023). A client running *inside* the Docker network would need a
# topology that announces the container names instead.
node a 127.0.0.1:7000 shardis-a:7000 primary 0-5460
node b 127.0.0.1:7001 shardis-b:7000 primary 5461-10922
node c 127.0.0.1:7002 shardis-c:7000 primary 10923-16383
node d 127.0.0.1:7003 shardis-d:7000 replica a
node e 127.0.0.1:7004 shardis-e:7000 replica b
node f 127.0.0.1:7005 shardis-f:7000 replica c
