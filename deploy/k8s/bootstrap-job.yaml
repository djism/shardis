# Forms the cluster once all six pods answer: shardis-0..2 primaries,
# shardis-3..5 their replicas. Safe to run again: on a formed cluster it
# does nothing (ADR 044).
apiVersion: batch/v1
kind: Job
metadata:
  name: shardis-bootstrap
  namespace: shardis
spec:
  backoffLimit: 10
  template:
    metadata:
      labels: {app.kubernetes.io/name: shardis, app.kubernetes.io/component: bootstrap}
    spec:
      restartPolicy: OnFailure
      securityContext: {runAsNonRoot: true, runAsUser: 65532}
      containers:
        - name: create
          image: shardis:dev
          imagePullPolicy: IfNotPresent
          command: ["/shardis-admin", "create", "-replicas", "1", "-nodes",
            "shardis-0.shardis.shardis.svc.cluster.local:7000,shardis-1.shardis.shardis.svc.cluster.local:7000,shardis-2.shardis.shardis.svc.cluster.local:7000,shardis-3.shardis.shardis.svc.cluster.local:7000,shardis-4.shardis.shardis.svc.cluster.local:7000,shardis-5.shardis.shardis.svc.cluster.local:7000"]
