<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" width="760" height="370" role="img" aria-labelledby="t d" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title id="t">Gossip convergence and bus overhead vs cluster size</title>
<desc id="d">6 nodes: converged in 2.2s (median of 3), 2.0 messages per node per second; 20 nodes: converged in 10.8s (median of 3), 5.3 messages per node per second; 50 nodes: converged in 11.2s (median of 3), 13.4 messages per node per second</desc>
<style>
  svg { --surface:#fcfcfb; --text:#0b0b0b; --text2:#52514e; --grid:#e6e5e0; --s1:#2a78d6; }
  @media (prefers-color-scheme: dark) { svg { --surface:#1a1a19; --text:#f0efec; --text2:#c3c2b7; --grid:#353431; --s1:#3987e5; } }
  .bg { fill: var(--surface); }
  .title { fill: var(--text); font-size: 16px; font-weight: 600; }
  .sub, .tick { fill: var(--text2); font-size: 12px; }
  .ptitle { fill: var(--text); font-size: 13px; font-weight: 600; }
  .val { fill: var(--text); font-size: 12px; font-weight: 600; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .line { stroke: var(--s1); stroke-width: 2; fill: none; }
  .whisker { stroke: var(--s1); stroke-width: 2; opacity: .45; }
  .dot { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
  .dot:hover { stroke: var(--text); }
</style>
<rect class="bg" width="760" height="370"/>
<text class="title" x="16" y="26">Gossip: how fast it spreads, what it costs</text>
<text class="sub" x="16" y="44">Nodes MEET'd in a chain (worst case), node timeout 15 s. Whiskers: min–max of 3 runs.</text>
<text class="ptitle" x="20" y="82">Time until every node knows every node</text>
<line class="grid" x1="80" x2="320" y1="310.0" y2="310.0"/>
<text class="tick" x="72" y="314.0" text-anchor="end">0</text>
<line class="grid" x1="80" x2="320" y1="254.4" y2="254.4"/>
<text class="tick" x="72" y="258.4" text-anchor="end">5</text>
<line class="grid" x1="80" x2="320" y1="198.9" y2="198.9"/>
<text class="tick" x="72" y="202.9" text-anchor="end">10</text>
<line class="grid" x1="80" x2="320" y1="143.3" y2="143.3"/>
<text class="tick" x="72" y="147.3" text-anchor="end">15</text>
<text class="tick" x="106.2" y="328" text-anchor="middle">6</text>
<text class="tick" x="167.3" y="328" text-anchor="middle">20</text>
<text class="tick" x="298.2" y="328" text-anchor="middle">50</text>
<text class="tick" x="200.0" y="348" text-anchor="middle">nodes in the cluster</text>
<text class="tick" x="32" y="210.0" transform="rotate(-90 32 210.0)" text-anchor="middle">seconds</text>
<path class="line" d="M106.2,285.3 L167.3,189.8 L298.2,185.6"/>
<line class="whisker" x1="106.2" x2="106.2" y1="294.3" y2="285.3"/>
<circle class="dot" cx="106.2" cy="285.3" r="5"><title>6 nodes: 2.2s median, 1.4-2.2s over 3 runs</title></circle>
<text class="val" x="115.2" y="277.3">2.2</text>
<line class="whisker" x1="167.3" x2="167.3" y1="218.8" y2="178.7"/>
<circle class="dot" cx="167.3" cy="189.8" r="5"><title>20 nodes: 10.8s median, 8.2-11.8s over 3 runs</title></circle>
<text class="val" x="176.3" y="181.8">10.8</text>
<line class="whisker" x1="298.2" x2="298.2" y1="190.0" y2="133.3"/>
<circle class="dot" cx="298.2" cy="185.6" r="5"><title>50 nodes: 11.2s median, 10.8-15.9s over 3 runs</title></circle>
<text class="val" x="307.2" y="177.6">11.2</text>
<text class="ptitle" x="400" y="82">Bus messages sent per node per second</text>
<line class="grid" x1="460" x2="700" y1="310.0" y2="310.0"/>
<text class="tick" x="452" y="314.0" text-anchor="end">0</text>
<line class="grid" x1="460" x2="700" y1="247.5" y2="247.5"/>
<text class="tick" x="452" y="251.5" text-anchor="end">5</text>
<line class="grid" x1="460" x2="700" y1="185.0" y2="185.0"/>
<text class="tick" x="452" y="189.0" text-anchor="end">10</text>
<line class="grid" x1="460" x2="700" y1="122.5" y2="122.5"/>
<text class="tick" x="452" y="126.5" text-anchor="end">15</text>
<text class="tick" x="486.2" y="328" text-anchor="middle">6</text>
<text class="tick" x="547.3" y="328" text-anchor="middle">20</text>
<text class="tick" x="678.2" y="328" text-anchor="middle">50</text>
<text class="tick" x="580.0" y="348" text-anchor="middle">nodes in the cluster</text>
<text class="tick" x="412" y="210.0" transform="rotate(-90 412 210.0)" text-anchor="middle">messages / s</text>
<path class="line" d="M486.2,285.0 L547.3,243.8 L678.2,142.5"/>
<circle class="dot" cx="486.2" cy="285.0" r="5"><title>6 nodes: 2.0 msgs/s, 4.8 KB/s per node</title></circle>
<text class="val" x="495.2" y="277.0">2.0</text>
<circle class="dot" cx="547.3" cy="243.8" r="5"><title>20 nodes: 5.3 msgs/s, 12.7 KB/s per node</title></circle>
<text class="val" x="556.3" y="235.8">5.3</text>
<circle class="dot" cx="678.2" cy="142.5" r="5"><title>50 nodes: 13.4 msgs/s, 34.3 KB/s per node</title></circle>
<text class="val" x="687.2" y="134.5">13.4</text>
</svg>
